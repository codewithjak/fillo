[project]
name = "fillo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "codewithjak", email = "en.junaidkhan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "playwright>=1.64.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
fillo = "app.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
